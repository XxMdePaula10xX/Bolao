# ============================================================
#  Codemagic — build do Bolão Flex (web empacotada com Capacitor)
# ------------------------------------------------------------
#  Gera o app instalável a partir da versão WEB (pasta web/),
#  embrulhada em nativo pelo Capacitor (pasta mobile/).
#
#  ANTES DE RODAR, no painel do Codemagic (Settings > Environment
#  variables) crie um GRUPO chamado  firebase_config  com estas
#  variáveis (os MESMOS valores do seu Firebase / do .env):
#     FB_API_KEY, FB_AUTH_DOMAIN, FB_PROJECT_ID,
#     FB_STORAGE_BUCKET, FB_MSG_SENDER_ID, FB_APP_ID
#  Assim a chave não fica no repositório.
# ============================================================

workflows:
  # ---------------- ANDROID (grátis, sem conta Apple) ----------------
  android-apk:
    name: Bolão Flex · Android (APK)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - firebase_config
      node: 20
      java: 17
    scripts:
      - name: Gerar web/firebase-config.js a partir das variáveis
        script: |
          cat > web/firebase-config.js <<EOF
          export const firebaseConfig = {
            apiKey: "$FB_API_KEY",
            authDomain: "$FB_AUTH_DOMAIN",
            projectId: "$FB_PROJECT_ID",
            storageBucket: "$FB_STORAGE_BUCKET",
            messagingSenderId: "$FB_MSG_SENDER_ID",
            appId: "$FB_APP_ID"
          };
          EOF
      - name: Preparar Capacitor (copiar web + adicionar Android)
        script: |
          cd mobile
          npm install
          rm -rf www && mkdir www && cp -r ../web/. www/
          npx cap add android || true
          npx cap sync android
      - name: Compilar APK (debug — instalável direto no celular)
        script: |
          cd mobile/android
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com
        notify:
          success: true
          failure: true

  # ---------------- iOS (precisa de conta Apple Developer) ----------------
  # Descomente e configure o "code signing" (certificado + provisioning)
  # no painel do Codemagic depois de ter a conta Apple (US$99/ano).
  ios-ipa:
    name: Bolão Flex · iOS (IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - firebase_config
        # - apple_signing   # <- grupo com os dados de assinatura da Apple
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Gerar web/firebase-config.js
        script: |
          cat > web/firebase-config.js <<EOF
          export const firebaseConfig = {
            apiKey: "$FB_API_KEY",
            authDomain: "$FB_AUTH_DOMAIN",
            projectId: "$FB_PROJECT_ID",
            storageBucket: "$FB_STORAGE_BUCKET",
            messagingSenderId: "$FB_MSG_SENDER_ID",
            appId: "$FB_APP_ID"
          };
          EOF
      - name: Preparar Capacitor (copiar web + adicionar iOS)
        script: |
          cd mobile
          npm install
          rm -rf www && mkdir www && cp -r ../web/. www/
          npx cap add ios || true
          npx cap sync ios
      - name: (Assinatura Apple necessária aqui)
        script: |
          echo "Configure o code signing no painel do Codemagic para gerar o .ipa."
          echo "Sem a conta Apple Developer, o build iOS não consegue assinar o app."
          # Exemplo depois de configurar a assinatura:
          # xcode-project build-ipa \
          #   --workspace mobile/ios/App/App.xcworkspace \
          #   --scheme App
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com
