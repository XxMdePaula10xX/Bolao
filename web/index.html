<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0d">
<title>Bolão Flex</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- HEADER -->
<header id="app-header" class="hidden">
  <div class="logo" id="home-logo">
    <div class="ball">2×1</div>
    <div>
      <h1>BOLÃO <span>FLEX</span></h1>
      <small id="header-sub">MEUS BOLÕES</small>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="btn-refresh" title="Atualizar">↻</button>
    <button class="icon-btn" id="btn-logout" title="Sair">⏻</button>
  </div>
</header>

<!-- NAV (só no bolão) -->
<nav class="tabs hidden" id="pool-tabs"></nav>

<main>
  <!-- AUTH -->
  <section class="screen active" id="screen-auth">
    <div class="auth-logo">
      <div class="shield">2×1</div>
      <h1>BOLÃO <span>FLEX</span></h1>
      <p>Bolões customizáveis, sem planilha.</p>
    </div>
    <div id="auth-form"></div>
  </section>

  <!-- HOME -->
  <section class="screen" id="screen-home"></section>

  <!-- POOL -->
  <section class="screen" id="screen-pool"></section>
</main>

<div id="modal-root"></div>
<div id="toast"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
